# Format check, type check and tests on every push and pull request, with
# diagnostics annotated on pull requests. The Bynk version comes from
# BYNK_VERSION, the same file the dev container installs from.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bynk:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-ci@16971dbe8db701e2cd3905f68f9e2f50e84ab366 # v1.2.1
        with:
          version-file: BYNK_VERSION
          source: .
